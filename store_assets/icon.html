<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 512px; height: 512px; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0fcfbb"/>
      <stop offset="100%" style="stop-color:#076b60"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
    <filter id="glowX">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="rgba(255,90,90,0.8)"/>
    </filter>
    <filter id="glowO">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="rgba(255,255,255,0.8)"/>
    </filter>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="90" ry="90" fill="url(#bg)"/>

  <!-- Brillo superior -->
  <ellipse cx="256" cy="80" rx="180" ry="60" fill="rgba(255,255,255,0.08)"/>

  <!-- Tablero: líneas -->
  <!-- Líneas verticales -->
  <line x1="192" y1="110" x2="192" y2="402" stroke="rgba(255,255,255,0.85)" stroke-width="10" stroke-linecap="round"/>
  <line x1="320" y1="110" x2="320" y2="402" stroke="rgba(255,255,255,0.85)" stroke-width="10" stroke-linecap="round"/>
  <!-- Líneas horizontales -->
  <line x1="110" y1="208" x2="402" y2="208" stroke="rgba(255,255,255,0.85)" stroke-width="10" stroke-linecap="round"/>
  <line x1="110" y1="304" x2="402" y2="304" stroke="rgba(255,255,255,0.85)" stroke-width="10" stroke-linecap="round"/>

  <!-- X (celda superior-izquierda) en rojo coral -->
  <g filter="url(#glowX)">
    <line x1="130" y1="130" x2="172" y2="188" stroke="#ff5252" stroke-width="16" stroke-linecap="round"/>
    <line x1="172" y1="130" x2="130" y2="188" stroke="#ff5252" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- O (celda central) en blanco -->
  <g filter="url(#glowO)">
    <circle cx="256" cy="256" r="34" fill="none" stroke="white" stroke-width="16"/>
  </g>

  <!-- X (celda inferior-derecha) en rojo coral -->
  <g filter="url(#glowX)">
    <line x1="340" y1="324" x2="382" y2="382" stroke="#ff5252" stroke-width="16" stroke-linecap="round"/>
    <line x1="382" y1="324" x2="340" y2="382" stroke="#ff5252" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- O (celda superior-derecha) en blanco -->
  <g filter="url(#glowO)">
    <circle cx="362" cy="159" r="32" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="13"/>
  </g>

  <!-- X pequeña (celda inferior-izquierda) -->
  <g opacity="0.6">
    <line x1="130" y1="324" x2="168" y2="380" stroke="#ff5252" stroke-width="13" stroke-linecap="round"/>
    <line x1="168" y1="324" x2="130" y2="380" stroke="#ff5252" stroke-width="13" stroke-linecap="round"/>
  </g>
</svg>
</body>
</html>
