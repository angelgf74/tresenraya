// ============================================================================
//  build-extras.gradle  —  Optimizacion de la build de release (R8)
// ----------------------------------------------------------------------------
//  Este fichero es la FUENTE DE VERDAD. El hook hooks/copy-android-config.js
//  lo copia a platforms/android/app/build-extras.gradle antes de cada build,
//  de modo que sobrevive a "cordova platform rm/add android".
//
//  Cordova aplica build-extras.gradle ANTES del bloque android {}, por eso la
//  configuracion se mete en ext.postBuildExtras, que se ejecuta al final del
//  app/build.gradle generado por Cordova.
// ============================================================================

ext.postBuildExtras = {
    android {
        buildTypes {
            release {
                // R8: elimina codigo muerto y ofusca nombres.
                minifyEnabled true

                // Elimina recursos (res/) no referenciados. Requiere minifyEnabled.
                shrinkResources true

                // proguard-android-optimize.txt activa las optimizaciones de R8
                // (la variante sin "-optimize" las desactiva).
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                              'proguard-rules.pro'
            }

            debug {
                // La build de debug se deja intacta para no ralentizar el ciclo
                // de desarrollo ni romper el stacktrace.
                minifyEnabled false
                shrinkResources false
            }
        }

        // Metadatos que no aportan nada en runtime y solo ocupan sitio en el AAB.
        packagingOptions {
            resources {
                excludes += [
                    'META-INF/*.version',
                    'META-INF/*.kotlin_module',
                    'META-INF/DEPENDENCIES',
                    'META-INF/proguard/**',
                    'DebugProbesKt.bin',
                    'kotlin-tooling-metadata.json'
                ]
            }
        }
    }
}
